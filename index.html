<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Torreta Naval</title>
<style>
:root{
  --bg:#eef1f4; --card:#fff; --ink:#18212b; --muted:#5b6672; --line:#d5dbe2;
  --accent:#1f6f8b; --ok:#2f9e44; --bad:#c92a2a; --laser:#e0241b;
  --f-body:-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif; --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1418; --card:#1a2128; --ink:#e8edf1; --muted:#9aa6b2; --line:#2c3642; --accent:#5fb7d4; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1418; --card:#1a2128; --ink:#e8edf1; --muted:#9aa6b2; --line:#2c3642; --accent:#5fb7d4; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.4}
.wrap{max-width:460px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:grid;gap:14px}
h1{margin:4px 0 0;font-size:1.5rem}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:14px 16px;font-weight:600;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.conn{display:flex;align-items:center;gap:10px;font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;background:var(--bad);flex:none}
.dot.on{background:var(--ok)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.coord{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px}
.coord .lab{font-size:1.6rem;font-weight:800;width:36px;text-align:center}
.stepper{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:8px;min-width:0}
.stepper button{padding:0;font-size:1.6rem;height:56px}
.stepper input{min-width:0;width:100%;height:56px;text-align:center;font:700 1.8rem var(--f-mono);border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.cell{font:800 2.2rem var(--f-mono);text-align:center;letter-spacing:.04em}
.cell small{display:block;font:500 .85rem var(--f-body);color:var(--muted);letter-spacing:0}
#fire{background:var(--laser);border-color:var(--laser);color:#fff;font-size:1.3rem;padding:18px}
#msg{min-height:1.4em;text-align:center;font-size:.95rem}
.err{color:var(--bad)}
.muted{color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>Torreta Naval</h1>

  <section class="card">
    <div class="conn"><span class="dot" id="dot"></span><span id="connTxt">Desconectado</span></div>
    <div class="row">
      <button class="primary" id="btnConn" type="button">Conectar</button>
      <button id="btnDisc" type="button" disabled>Desconectar</button>
    </div>
    <p class="muted" id="nobt" hidden>Este navegador no tiene Bluetooth. En iPhone abre esta página con la app <b>Bluefy</b>.</p>
  </section>

  <section class="card">
    <div class="coord">
      <span class="lab">X</span>
      <div class="stepper"><button type="button" data-d="x,-1" aria-label="X menos uno">−</button><input id="inX" type="number" inputmode="numeric" min="1" max="20" value="1" aria-label="X, columna de 1 a 20"><button type="button" data-d="x,1" aria-label="X más uno">+</button></div>
      <span class="lab">Y</span>
      <div class="stepper"><button type="button" data-d="y,-1" aria-label="Y menos uno">−</button><input id="inY" type="number" inputmode="numeric" min="1" max="20" value="1" aria-label="Y, fila de 1 a 20"><button type="button" data-d="y,1" aria-label="Y más uno">+</button></div>
    </div>
    <div class="cell" id="cell">A1<small>casilla</small></div>
    <button id="fire" type="button" disabled>Disparar</button>
    <div class="row">
      <button id="btnOff" type="button" disabled>Apagar láser</button>
    </div>
    <p id="msg" aria-live="polite"></p>
  </section>

  <p class="muted">X es la columna (1 = A … 20 = T) e Y es la fila (1 … 20). La torreta mueve primero X, espera 2 s, mueve Y y prende el láser.</p>
</div>

const COLS='ABCDEFGHIJKLMNOPQRST';
const SVC=0xffe0, CHR=0xffe1;               // módulo BLE "HC-05": servicio FFE0, característica FFE1
const VEL=0.5, ACCEL=0.012, PAUSA=2000;     // velocidad y aceleración del Arduino; pausa entre X e Y
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const enc=new TextEncoder();
let dev=null, chr=null, busy=false;
// última posición mandada (la torreta no contesta por Bluetooth)
let pos=null; try{ pos=JSON.parse(localStorage.getItem('ip-pos')); }catch(e){}
function savePos(){ try{ localStorage.setItem('ip-pos',JSON.stringify(pos)); }catch(e){} }
const travel=d=>d/VEL*15+(VEL/ACCEL)*15+300;   // ms para recorrer d grados con arranque y frenado suaves

function msg(t,err){ $('msg').textContent=t; $('msg').className=err?'err':''; }
function setConn(on){
  $('dot').classList.toggle('on',on);
  $('connTxt').textContent=on?('Conectado · '+(dev&&dev.name||'HC-05')):'Desconectado';
  $('btnConn').disabled=on||!navigator.bluetooth; $('btnDisc').disabled=!on;
  $('fire').disabled=!on||busy; $('btnOff').disabled=!on;
}
if(!navigator.bluetooth){ $('nobt').hidden=false; }
setConn(false);

// envíos en fila (Bluetooth no acepta dos escrituras a la vez)
let q=Promise.resolve();
function send(cmd){
  const job=q.then(async()=>{
    if(!chr) throw new Error('sin conexión');
    const data=enc.encode(cmd+'\n');
    if(chr.writeValueWithResponse) await chr.writeValueWithResponse(data); else await chr.writeValue(data);
  });
  q=job.catch(()=>{}); return job;
}

$('btnConn').onclick=async()=>{
  try{
    dev=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]},{namePrefix:'HC'}],optionalServices:[SVC]});
    dev.addEventListener('gattserverdisconnected',()=>{ chr=null; setConn(false); msg('Se desconectó el Bluetooth.',true); });
    msg('Conectando…');
    const srv=await dev.gatt.connect();
    chr=await (await srv.getPrimaryService(SVC)).getCharacteristic(CHR);
    setConn(true); msg('Listo. Elige X e Y y pulsa Disparar.');
    await send('V'+VEL);
  }catch(e){ chr=null; setConn(false); if(e.name!=='NotFoundError') msg('No se pudo conectar: '+e.message,true); }
};
$('btnDisc').onclick=()=>{ try{ if(dev&&dev.gatt.connected) dev.gatt.disconnect(); }catch(e){} chr=null; setConn(false); msg('Desconectado.'); };

// X e Y de 1 a 20 → casilla con letra (1 = A … 20 = T)
function val(id){ const n=parseInt($(id).value,10); return isFinite(n)?Math.min(20,Math.max(1,n)):null; }
function showCell(){
  const x=val('inX'), y=val('inY');
  $('cell').innerHTML=(x&&y?COLS[x-1]+y:'–')+'<small>casilla</small>';
}
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
  const [ax,d]=b.dataset.d.split(','); const id=ax==='x'?'inX':'inY';
  $(id).value=Math.min(20,Math.max(1,(val(id)||1)+(+d))); showCell();
});
['inX','inY'].forEach(id=>{
  $(id).addEventListener('input',showCell);
  $(id).addEventListener('change',()=>{ const v=val(id); $(id).value=v||1; showCell(); });
});

$('fire').onclick=async()=>{
  const x=val('inX'), y=val('inY');
  if(!x||!y){ msg('X e Y deben ser números del 1 al 20.',true); return; }
  const k=COLS[x-1]+y, t=TABLA[k];
  if(!t){ msg('La casilla '+k+' no está en la tabla.',true); return; }
  busy=true; setConn(!!chr);
  try{
    await send('L0');
    // 1) eje X
    const dp=pos?Math.abs(t.p-pos.p):120;
    msg(k+': moviendo X…');
    await send('P'+t.p.toFixed(1));
    await sleep(travel(dp));
    pos=Object.assign({},pos||{},{p:t.p}); savePos();
    // 2) pausa
    msg(k+': esperando…'); await sleep(PAUSA);
    // 3) eje Y
    const de=(pos.e!==undefined)?Math.abs(t.e-pos.e):120;
    msg(k+': moviendo Y…');
    await send('T'+t.e.toFixed(1));
    await sleep(travel(de));
    pos.e=t.e; savePos();
    // 4) láser
    await send('L1');
    msg('🎯 Disparo en '+k);
  }catch(e){ msg('No hay conexión con la torreta.',true); }
  busy=false; setConn(!!chr);
};
$('btnOff').onclick=()=>send('L0').then(()=>msg('Láser apagado.')).catch(()=>msg('No hay conexión.',true));
showCell();
</script>
